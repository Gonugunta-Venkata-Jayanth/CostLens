[project]
name = "costlens"
version = "0.1.0"
description = "AWS cost anomaly detection and spend forecasting"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jayanth Gonugunta Venkata" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["costlens", "api", "aws"]
