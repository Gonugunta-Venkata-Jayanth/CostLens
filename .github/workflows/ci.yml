name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and integration tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Validate SAM template
        run: cfn-lint infra/template.yaml
      - name: Detection quality gate (synthetic data)
        run: |
          python scripts/evaluate.py
          python -c "import json,sys; r={x['threshold']:x for x in json.load(open('reports/evaluation.json'))['results']}[4.0]; sys.exit(0 if r['f1']>=0.90 else 1)"
      - name: Build static demo and Lambda bundle
        run: |
          python scripts/build_demo.py
          bash scripts/package_lambda.sh
      - uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: dist/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t costlens:ci .
      - name: Smoke test container
        run: |
          docker run -d --name costlens -p 8000:8000 costlens:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/summary | python -c "import json,sys; d=json.load(sys.stdin); assert d['days']==120, d"
          curl -fsS "http://127.0.0.1:8000/api/anomalies?threshold=4" | python -c "import json,sys; assert json.load(sys.stdin)['count']>0"
          docker logs costlens
          docker rm -f costlens
